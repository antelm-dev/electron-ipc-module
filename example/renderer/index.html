<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>electron-ipc-module example</title>
  </head>
  <body>
    <main>
      <h1>Typed Electron IPC</h1>
      <p id="greeting">Loading greeting…</p>

      <label>
        Your name
        <input id="name" value="Ada" />
      </label>
      <button id="set-greeting">Set greeting</button>

      <label>
        Notice to main
        <input id="notice" value="A renderer message" />
      </label>
      <button id="send-notice">Send notice</button>

      <p id="status" aria-live="polite"></p>
    </main>
    <script type="module" src="../dist/renderer.js"></script>
  </body>
</html>
