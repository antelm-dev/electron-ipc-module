name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # electron is mocked in tests (test/setup.ts); only its types are exercised
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run fmt:check
      - run: pnpm run lint
      - if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  test:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        electron: [41, 42, 43]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add --save-dev --ignore-workspace-root-check electron@${{ matrix.electron }}
      - run: pnpm run typecheck
      - run: pnpm run test:api
      - run: pnpm run test

  example:
    # Builds example/ end to end: generation, compilation, and the sandboxed
    # CommonJS preload bundle. Electron is never launched, only built against.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm install --dir example --no-frozen-lockfile
      - run: pnpm run --dir example build
      - name: Verify the preload bundle is CommonJS
        run: node -e "const s=require('node:fs').readFileSync('example/dist/preload.cjs','utf8'); if (/^\s*import\s/m.test(s)) { console.error('preload bundle contains ESM import statements'); process.exit(1); }"
      - name: Verify the committed bridge is current
        run: pnpm run --dir example generate && git diff --exit-code example/generated
