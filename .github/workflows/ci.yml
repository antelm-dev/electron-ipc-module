name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # electron is mocked in tests (test/setup.ts); only its types are exercised
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run fmt:check
      - run: pnpm run lint
      - if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  test:
    strategy:
      fail-fast: false
      matrix:
        # Latest of each supported line. `packed-consumer` runs at the exact
        # `engines` floor against the published artifact.
        node: [22, 24]
        electron: [41, 42, 43]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add --save-dev --ignore-workspace-root-check electron@${{ matrix.electron }}
      - run: pnpm run typecheck
      - run: pnpm run test:api
      - run: pnpm run test

  coverage:
    # One run, not one per matrix entry: coverage measures this repository's
    # tests, which do not change with the Node or Electron version under test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:coverage

  packed-consumer:
    # Installs the packed tarball into an empty project so the published
    # dependency set is exercised instead of this repository's devDependencies.
    # Catches entry points that import a package we never declared.
    #
    # Runs at the exact `engines` floor, so the Node APIs the generator needs —
    # `path.matchesGlob` (22.5.0, which sets the floor) and `fs.globSync`
    # (22.0.0) — are proven present rather than assumed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22.5.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Pack the publishable artifact
        # npm, not pnpm: pnpm pack has no --ignore-scripts, and prepack would
        # re-run the full check suite the other jobs already cover.
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Install it into an empty project
        working-directory: ${{ runner.temp }}
        # npm installs peer dependencies by default, so a missing declaration
        # surfaces here as a load failure below rather than as a warning.
        run: |
          mkdir consumer && cd consumer
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/electron-ipc-module-*.tgz
      - name: The CLI loads and parses arguments
        working-directory: ${{ runner.temp }}/consumer
        run: ./node_modules/.bin/electron-ipc-module --help
      - name: The generator entry points load
        working-directory: ${{ runner.temp }}/consumer
        # The `.` runtime entry is deliberately excluded: it imports `electron`,
        # which is a path stub outside a real Electron main process, so plain
        # Node cannot load it. Only these two run under Node, and they are the
        # ones that reach for `typescript`.
        run: |
          cat > probe.mjs <<'EOF'
          const generator = await import("electron-ipc-module/generator");
          const rollupPlugin = await import("electron-ipc-module/rollup-plugin");
          if (typeof generator.runIpcBridgeGeneration !== "function") {
            throw new Error("generator entry point is missing runIpcBridgeGeneration");
          }
          if (typeof rollupPlugin.default !== "function") {
            throw new Error("rollup-plugin entry point is missing its default export");
          }
          // Runs the glob path, which reaches path.matchesGlob — the API that
          // sets the `engines` floor. Importing the module would not touch it.
          const options = { ipcDir: "./main/**/*.ipc.ts" };
          if (!generator.isIpcBridgeRelevantFile("./main/nested/profile.ipc.ts", options)) {
            throw new Error("a matching *.ipc.ts file was not recognised under a glob ipcDir");
          }
          if (generator.isIpcBridgeRelevantFile("./other/profile.ipc.ts", options)) {
            throw new Error("a file outside the glob ipcDir was treated as relevant");
          }
          // The other API the analyzer needs from Node itself, added in 22.0.0.
          const { globSync } = await import("node:fs");
          if (globSync("node_modules/electron-ipc-module/package.json").length !== 1) {
            throw new Error("fs.globSync did not match a file that exists");
          }
          EOF
          node probe.mjs

  example:
    # Builds example/ end to end — generation, compilation, and the sandboxed
    # CommonJS preload bundle — then launches it. This is the only job that runs
    # a real Electron process, and so the only one that can show the generator
    # and the runtime agreeing on channel names; everywhere else Electron is
    # mocked, which cannot catch the two halves drifting apart.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm install --dir example --no-frozen-lockfile
        env:
          # Overrides the workflow-wide skip: this job needs the real binary.
          ELECTRON_SKIP_BINARY_DOWNLOAD: ""
      - run: pnpm run --dir example build
      - name: Verify the preload bundle is CommonJS
        run: node -e "const s=require('node:fs').readFileSync('example/dist/preload.cjs','utf8'); if (/^\s*import\s/m.test(s)) { console.error('preload bundle contains ESM import statements'); process.exit(1); }"
      - name: Verify the committed bridge is current
        run: pnpm run --dir example generate && git diff --exit-code example/generated
      - name: Allow the Chromium sandbox to start
        # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor,
        # which is what the sandbox needs. Relaxing that is preferred over
        # --no-sandbox: the example runs with `sandbox: true` and the sandboxed
        # preload is the configuration the README tells people to use, so it is
        # the one worth exercising.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Drive the generated bridge in a real renderer
        run: xvfb-run -a pnpm run --dir example smoke
