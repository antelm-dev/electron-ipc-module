name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # Configured by release-please-config.json so bump-minor-pre-major
          # applies; it is not available as an action input.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing / provenance
    environment: npm
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `prepack` already runs `check && build` on publish
      - name: Publish with the appropriate npm dist-tag
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
      - name: Keep `next` from lagging behind `latest`
        # Publishing a stable release does not touch `next`, so it kept
        # pointing at 1.0.0-rc.1 after 1.0.0 shipped and `npm install …@next`
        # installed something older than `latest`. A stable release supersedes
        # the prereleases that led to it, so move the tag with it.
        #
        # Deliberately not `continue-on-error`: the package is already
        # published by this point, and a stranded tag is exactly what needs to
        # be noticed. The manual remedy is this same command.
        if: ${{ !contains(needs.release-please.outputs.tag, '-') }}
        run: npm dist-tag add "electron-ipc-module@${RELEASE_TAG#v}" next
