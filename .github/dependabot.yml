version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      # runtime deps ship in the published package.json, so a bump only reaches
      # users once it is released; `chore` is not a releasable unit for
      # release-please and would strand them on main indefinitely
      prefix: fix
      prefix-development: chore
    ignore:
      # TypeScript 7 is the Go port: it moved the Compiler API off the package
      # root export (`exports["."]` resolves to lib/version.cjs) and behind
      # `typescript/unstable/*`. src/shared/ts-utils.ts and the bridge analyzer
      # depend on that API, so a major bump cannot pass CI and the peer range
      # pins consumers to <7. Revisit when the replacement API drops `unstable`.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      dev-dependencies:
        dependency-type: development
        # majors get their own PR — src/shared/ts-utils.ts uses the TS compiler
        # API, so a grouped major bump takes the whole PR down with it
        update-types: [minor, patch]
